name: Build supplementary paper

on:
  push:
    paths:
      - "paper/src/**"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble LaTeX source
        run: |
          cat paper/src/*.tex > paper/CopyCAT_Additional_Material.tex

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CopyCAT_Additional_Material.tex
          working_directory: paper

      - name: Store canonical PDF name
        run: |
          cp paper/CopyCAT_Additional_Material.pdf "paper/CopyCAT Additional Material.pdf"

      - name: Commit generated paper
        run: |
          rm -rf paper/src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/CopyCAT_Additional_Material.tex "paper/CopyCAT Additional Material.pdf" paper/src
          git diff --cached --quiet && exit 0
          git commit -m "Build CopyCAT supplementary paper"
          git push
